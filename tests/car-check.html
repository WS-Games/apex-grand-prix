<!doctype html><html><body><pre id="out">pending</pre><script>
window.__shots={};const Q=new URLSearchParams(location.search);const f=document.createElement('iframe');f.src='../index.html?mptest=1'+(Q.get('pcgfx')?'&pcgfx='+Q.get('pcgfx'):'');f.style.cssText='width:1280px;height:720px;border:0';document.body.appendChild(f);
const ev=js=>f.contentWindow.__mpEval(js);const wait=ms=>new Promise(r=>setTimeout(r,ms));

 window.__shots.side=ev("(()=>{const b=player,sh=Math.sin(b.heading),ch=Math.cos(b.heading);camera.position.set(b.x+ch*7,(b.y||0)+1.5,b.z-sh*7);camera.lookAt(b.x,(b.y||0)+0.5,b.z);renderFrame();return renderer.domElement.toDataURL('image/jpeg',0.88);})()");
 document.getElementById('out').textContent=info+', errors '+ev('JSON.stringify(__errs.slice(0,3))');}catch(e){document.getElementById('out').textContent='ERR '+e.stack;}document.title='DONE';};
</script></body></html>
