<!doctype html><html><body><pre id="out">pending</pre><script>
// Costa showcase: screenshots from several viewpoints (golden hour + midday) on a chosen quality. Silent.
const Q=new URLSearchParams(location.search),q=Q.get('q')||'high';window.__shots={};const lines=[];const log=s=>{lines.push(s);document.getElementById('out').textContent=lines.join('\n');};
const f=document.createElement('iframe');f.src='../index.html?mptest=1';f.style.cssText='width:1280px;height:720px;border:0';document.body.appendChild(f);
const ev=js=>f.contentWindow.__mpEval(js);const wait=ms=>new Promise(r=>setTimeout(r,ms));
f.onload=async()=>{try{await wait(7000);
 ev(`window.__errs=[];const ce=console.error;console.error=(...a)=>{__errs.push(a.map(String).join(' ').slice(0,300));ce(...a)};window.addEventListener('error',e=>__errs.push(String(e.message)));
   S.quality='${q}';S.shadows={low:'off',medium:'medium',high:'high',ultra:'ultra'}['${q}'];applyShadows();applyQualityMaterials();S.weather='dry';`);
 for(const tod of (Q.get('tod')||'golden,day').split(',')){
  ev(`S.timeOfDay='${tod}';startRace({track:0,cls:'f1',mode:'tt',seed:3,weather:'dry'});`);await wait(9000);
  log(tod+': hq='+ev('gfxHQ()')+' seats='+ev('gfxSeats()')+' meshes '+ev('(()=>{let n=0,i=0,tri=0;trackGroup.traverse(o=>{if(o.isMesh){n++;if(o.isInstancedMesh)i+=o.count;}});return n+" / instances "+i;})()'));
  // viewpoints: grid start (looking down the straight), beside the pits, from a grandstand corner
  const views=[['grid',`player.x=trackAt(TR.L-40,0).x;player.z=trackAt(TR.L-40,0).z;player.heading=headingOf(trackAt(TR.L-40,0).tx,trackAt(TR.L-40,0).tz);camMode='chase';`],
               ['pits',`{const p=trackAt(TR.sEntry+180,4);player.x=p.x;player.z=p.z;player.heading=headingOf(p.tx,p.tz);camMode='chase';}`],
               ['tv',`camMode='tv';`]];
  for(const [name,js] of views){const url=ev(js+`player.vx=0;for(let i=0;i<40;i++){updateCarVisuals(0);updateCamera(1);}renderFrame();renderFrame();renderer.domElement.toDataURL('image/jpeg',0.85)`);window.__shots[tod+'_'+name]=url;}
  ev('quitToMenu()');await wait(500);}
 log('errors: '+ev('JSON.stringify(__errs.slice(0,5))'));}catch(e){log('ERR '+e.stack);}document.title='DONE';};
</script></body></html>
